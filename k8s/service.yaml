apiVersion: v1
kind: Service
metadata:
  name: autodeploy-lab
  namespace: autodeploy
  labels:
    app: autodeploy-lab
spec:
  selector:
    app: autodeploy-lab   # routes to pods with this label

  ports:
    - name: http
      protocol: TCP
      port: 80            # port the service listens on
      targetPort: 5000    # port on the pod to forward to

  type: LoadBalancer