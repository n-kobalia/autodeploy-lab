apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: autodeploy-lab-hpa
  namespace: autodeploy
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: autodeploy-lab

  minReplicas: 2
  maxReplicas: 5

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70  # scale up when CPU exceeds 70%